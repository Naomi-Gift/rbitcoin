[package]
name = "rbitcoin-esplora"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Esplora-compatible REST (electrs HTTP drop-in except address-prefix)"

[lib]
test = false
doctest = false

[features]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]


[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-electrum = { workspace = true }
rbitcoin-net = { workspace = true }
rbitcoin-consensus = { workspace = true }
bitcoin = { workspace = true }
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }
axum = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
