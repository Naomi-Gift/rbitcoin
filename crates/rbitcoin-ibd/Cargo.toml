[package]
name = "rbitcoin-ibd"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Multi-peer initial block download and confirm pipeline"

[lib]
test = false
doctest = false

[features]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]

[dependencies]
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-net = { workspace = true }
bitcoin = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# proc_pid_rusage: resident size for `ibd: sizes` / `tip: perf`.
libc = "0.2"

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "confirm_feed_wait"
path = "tests/confirm_feed_wait.rs"

[lints]
workspace = true
