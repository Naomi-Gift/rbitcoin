[package]
name = "rbitcoin-electrum"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Electrum protocol server (scripthash JSON-RPC over TCP)"

[lib]
test = false
doctest = false

[features]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]


[dependencies]
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-net = { workspace = true }
bitcoin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "listener_limits"
path = "tests/listener_limits.rs"

[lints]
workspace = true
