[package]
name = "rbitcoin-node"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "rbitcoin full node binary and lifecycle"

[lib]
test = false
doctest = false

[[bin]]
name = "rbitcoin-node"
path = "src/main.rs"
test = false


[features]
mutants = []

[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-mempool = { workspace = true }
rbitcoin-net = { workspace = true }
rbitcoin-ibd = { workspace = true }
rbitcoin-rpc = { workspace = true }
rbitcoin-electrum = { workspace = true }
rbitcoin-esplora = { workspace = true }
rbitcoin-sv2 = { workspace = true }
bitcoin = { workspace = true }
bitcoin_hashes = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower-http = { workspace = true }
tokio = { workspace = true }
mimalloc = { workspace = true }
getrandom = "0.4"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
