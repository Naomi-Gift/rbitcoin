# GitHub Release for annotated tags `v*.*.*` (0.5+).
#
# Not a required PR check. Builds the operator snapshots and attaches
# them to the tag. Linux musl (x86_64 and aarch64, each on a native
# runner) is the operator binary. Darwin is ad-hoc signed (not notarized).
# Windows is CRT-static PE (no IoRing). PR CI smokes Windows/Darwin store
# IO in ci.yml; it does not package.
#
# The operator image wraps the musl binaries (Dockerfile). `docker` smokes
# it per arch on a native runner and gates the Release. `docker-publish`
# pushes the multi-arch manifest to GHCR, and to Docker Hub when the repo
# variable DOCKERHUB_REPOSITORY is set, after the Release exists.
#
# Nightly builds master's musl binaries, smokes the image per arch, and
# pushes it as `nightly` and `nightly-YYYYMMDD` to the same registries. It
# skips Windows, Darwin, the NixOS VM test, and the GitHub Release.
#
# Triggers:
#   - push of tag v*.*.* (publishes the Release and the image)
#   - schedule (nightly image from master)
#   - workflow_dispatch with nightly (the same, on demand; master only)
#   - workflow_dispatch without nightly (build and smoke only; no push)

name: release

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to build (empty = this branch tip)
        required: false
        default: ""
      nightly:
        description: Publish the nightly image (master tip only; ref must be empty)
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BUILD_REF: ${{ inputs.ref || github.sha }}
  NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

jobs:
  musl:
    name: musl-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Both legs build the same SHA, so either leg's short is the run's.
    outputs:
      short: ${{ steps.meta.outputs.short }}
    steps:
      # `nightly` must only ever name master. Another branch or a `ref`
      # would publish code that is not on it.
      - name: Nightly builds the master tip
        if: env.NIGHTLY == 'true'
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/master || -n "$INPUT_REF" ]]; then
            echo "nightly needs refs/heads/master and an empty ref (got $GITHUB_REF, ref '$INPUT_REF')" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Record built SHA
        id: meta
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      # A hand-pushed tag on the wrong commit must not publish mislabeled
      # binaries. Same awk as scripts/release.sh cargo_workspace_version.
      - name: Tag matches Cargo.toml workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#v}"
          crate_ver="$(awk '
            /^\[workspace\.package\]$/ { p = 1; next }
            /^\[/ { p = 0 }
            p && /^version = "/ { gsub(/version = "|"$/, ""); print; exit }
          ' Cargo.toml)"
          if [[ "$tag_ver" != "$crate_ver" ]]; then
            echo "tag v$tag_ver != Cargo.toml workspace version $crate_ver" >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = auto

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: musl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: musl-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: musl-${{ runner.os }}-${{ runner.arch }}-
          purge-last-accessed: P7D
          purge-primary-key: never

      # .#rbitcoin-musl is this runner's system: x86_64 or aarch64 static.
      - name: Build musl (flake)
        run: ./scripts/repro-build.sh musl ./result

      - name: Stage artifacts
        run: ./scripts/stage-musl-artifacts.sh ./result ./dist

      - name: SBOM
        run: ./scripts/sbom.sh ./dist/rbitcoin.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbitcoin-musl-${{ matrix.arch }}-linux-${{ steps.meta.outputs.short }}
          path: |
            dist/rbitcoin-node
            dist/rbitcoin-cli
            dist/SHA256SUMS
            dist/rbitcoin.cdx.json
          if-no-files-found: error
          retention-days: 90

  # Per-arch image smoke on a native runner, before the Release. Nothing is
  # pushed here. This is also the only boot of the aarch64 binary before it
  # ships, so `publish` needs it.
  docker:
    name: docker-${{ matrix.platform }}
    needs: [musl]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Download musl artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.musl.outputs.short }}
        run: |
          set -euo pipefail
          short="$SHORT"
          dir="dist/docker/${{ matrix.platform }}"
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            -n "rbitcoin-musl-${{ matrix.arch }}-linux-${short}" -D "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)

      - name: Build image (native arch)
        run: docker build -t rbitcoin:smoke -f Dockerfile dist/docker

      - name: Smoke image
        run: ./scripts/docker-smoke.sh rbitcoin:smoke "dist/docker/${{ matrix.platform }}/SHA256SUMS"

  windows:
    name: windows
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/release-win
      RUSTFLAGS: "-C target-feature=+crt-static -C debuginfo=0 -C strip=symbols"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Record built SHA
        id: meta
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      # No build cache: cached objects must not feed shipped binaries.
      - name: Build CRT-static node + cli
        run: cargo build --release --target x86_64-pc-windows-msvc -p rbitcoin-node -p rbitcoin-cli

      - name: Stage artifacts
        run: ./scripts/stage-native-artifacts.sh windows target/release-win/x86_64-pc-windows-msvc/release ./dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbitcoin-x86_64-windows-${{ steps.meta.outputs.short }}
          path: |
            dist/rbitcoin-node.exe
            dist/rbitcoin-cli.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macos
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/release-darwin
      RUSTFLAGS: "-C debuginfo=0 -C strip=symbols"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Record built SHA
        id: meta
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      # No build cache: cached objects must not feed shipped binaries.
      - name: Build node + cli
        run: cargo build --release -p rbitcoin-node -p rbitcoin-cli

      - name: Stage artifacts
        run: ./scripts/stage-native-artifacts.sh darwin target/release-darwin/release ./dist

      - name: Verify ad-hoc codesign
        run: |
          set -euo pipefail
          codesign -v dist/rbitcoin-node
          codesign -v dist/rbitcoin-cli

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbitcoin-aarch64-darwin-${{ steps.meta.outputs.short }}
          path: |
            dist/rbitcoin-node
            dist/rbitcoin-cli
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  nixos-module-runtime:
    name: nixos-module-runtime
    if: github.event_name != 'schedule' && !inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = auto
            system-features = nixos-test benchmark big-parallel kvm

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nixos-module-runtime-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nixos-module-runtime-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Test NixOS module service
        run: timeout 20m nix build .#checks.x86_64-linux.nixos-module-runtime --no-link

  publish:
    name: github-release
    needs: [musl, docker, windows, macos, nixos-module-runtime]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.musl.outputs.short }}
        run: |
          set -euo pipefail
          short="$SHORT"
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            -n "rbitcoin-musl-x86_64-linux-${short}" -D musl
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            -n "rbitcoin-musl-aarch64-linux-${short}" -D musl-aarch64
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            -n "rbitcoin-x86_64-windows-${short}" -D windows
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            -n "rbitcoin-aarch64-darwin-${short}" -D darwin
          mkdir -p dist
          cp musl/rbitcoin-node musl/rbitcoin-cli musl/SHA256SUMS musl/rbitcoin.cdx.json dist/
          mv dist/SHA256SUMS dist/SHA256SUMS.linux-musl
          mv dist/rbitcoin-node dist/rbitcoin-node-x86_64-linux
          mv dist/rbitcoin-cli dist/rbitcoin-cli-x86_64-linux
          cp musl-aarch64/rbitcoin-node dist/rbitcoin-node-aarch64-linux
          cp musl-aarch64/rbitcoin-cli dist/rbitcoin-cli-aarch64-linux
          cp musl-aarch64/SHA256SUMS dist/SHA256SUMS.linux-musl-aarch64
          cp windows/rbitcoin-node.exe windows/rbitcoin-cli.exe windows/SHA256SUMS dist/
          mv dist/SHA256SUMS dist/SHA256SUMS.windows
          mv dist/rbitcoin-node.exe dist/rbitcoin-node-x86_64-windows.exe
          mv dist/rbitcoin-cli.exe dist/rbitcoin-cli-x86_64-windows.exe
          cp darwin/rbitcoin-node darwin/rbitcoin-cli darwin/SHA256SUMS dist/
          mv dist/SHA256SUMS dist/SHA256SUMS.darwin
          mv dist/rbitcoin-node dist/rbitcoin-node-aarch64-darwin
          mv dist/rbitcoin-cli dist/rbitcoin-cli-aarch64-darwin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(./scripts/release-notes.sh "${tag#v}")"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "rbitcoin ${tag}" \
            --notes "$notes" \
            dist/rbitcoin-node-x86_64-linux \
            dist/rbitcoin-cli-x86_64-linux \
            dist/SHA256SUMS.linux-musl \
            dist/rbitcoin-node-aarch64-linux \
            dist/rbitcoin-cli-aarch64-linux \
            dist/SHA256SUMS.linux-musl-aarch64 \
            dist/rbitcoin.cdx.json \
            dist/rbitcoin-node-x86_64-windows.exe \
            dist/rbitcoin-cli-x86_64-windows.exe \
            dist/SHA256SUMS.windows \
            dist/rbitcoin-node-aarch64-darwin \
            dist/rbitcoin-cli-aarch64-darwin \
            dist/SHA256SUMS.darwin

  # Multi-arch manifest after the Release exists, or after both smoke legs
  # on a nightly (no Release). The Dockerfile has no
  # RUN, so this one runner assembles amd64 + arm64 without emulation from
  # the same staged binaries the `docker` legs smoked (sha256sum -c below).
  # GHCR always; Docker Hub when vars.DOCKERHUB_REPOSITORY is set (with
  # vars.DOCKERHUB_USERNAME and secrets.DOCKERHUB_TOKEN). Tags:
  # scripts/docker-tags.sh.
  docker-publish:
    name: docker-publish
    needs: [musl, docker, publish]
    # `publish` is skipped on a nightly, so success() cannot gate this.
    if: >-
      !cancelled() && needs.musl.result == 'success' && needs.docker.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
      github.event_name == 'schedule' || inputs.nightly)
    # One tag (or nightly) at a time across the repo. Each run picks X.Y /
    # latest from the tags it fetches at its own start, so a tag pushed
    # while another publishes cannot move them backwards. The workflow
    # group above is per tag and does not serialize this. queue: max keeps
    # every waiting tag; the default keeps one and cancels the older
    # pending run.
    concurrency:
      group: docker-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      # buildx-stable-1 on 2026-10-22. Pinned so the manifest builder does
      # not float under a release.
      BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      # Full history for the tag list docker-tags.sh compares against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download musl artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.musl.outputs.short }}
        run: |
          set -euo pipefail
          short="$SHORT"
          for pair in x86_64:amd64 aarch64:arm64; do
            dir="dist/docker/${pair#*:}"
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -n "rbitcoin-musl-${pair%%:*}-linux-${short}" -D "$dir"
            (cd "$dir" && sha256sum -c SHA256SUMS)
          done

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_REPOSITORY != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push multi-arch image
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY" == true ]]; then
            # A re-run keeps its run's SHA, which master may have passed,
            # and would move `nightly` back onto it. Fresh nightlies run in
            # trigger order (the workflow group), so only a re-run can.
            if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
              echo "nightly re-run of ${GITHUB_SHA:0:12} refused: dispatch a new nightly instead" >&2
              exit 1
            fi
            tags="$(./scripts/docker-tags.sh --nightly "$(date -u +%Y%m%d)")"
          else
            tags="$(./scripts/docker-tags.sh "$GITHUB_REF_NAME")"
          fi
          # The first tag is the version label: X.Y.Z, or nightly-YYYYMMDD.
          ver="$(head -n 1 <<<"$tags")"
          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [[ -n "$DOCKERHUB_REPOSITORY" ]]; then
            images+=("docker.io/$DOCKERHUB_REPOSITORY")
          fi
          refs=()
          for t in $tags; do
            for i in "${images[@]}"; do
              refs+=("$i:$t")
            done
          done
          printf 'push %s\n' "${refs[@]}"
          tag_args=()
          for r in "${refs[@]}"; do
            tag_args+=(--tag "$r")
          done
          # Commit time for image and file timestamps, so a rerun of this
          # tag gives the same platform manifests.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx create --name rbitcoin-release --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$ver" --build-arg "REVISION=$(git rev-parse HEAD)" \
            --provenance=mode=max \
            --output type=image,push=true,rewrite-timestamp=true \
            --metadata-file "$RUNNER_TEMP/image.json" \
            "${tag_args[@]}" \
            -f Dockerfile dist/docker
          echo "index digest: $(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")"
          for i in "${images[@]}"; do
            docker buildx imagetools inspect "$i:$ver"
          done
